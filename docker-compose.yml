services:
  share:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guacamolegh-share
    restart: unless-stopped
    ports:
      - "${PORT:-3103}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/share.db
      - STORAGE_PATH=/app/storage
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES:-2147483648}
      - MAX_TRANSFER_SIZE_BYTES=${MAX_TRANSFER_SIZE_BYTES:-10737418240}
      - CHUNK_SIZE_BYTES=${CHUNK_SIZE_BYTES:-8388608}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
